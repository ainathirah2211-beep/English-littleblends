<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Improve English</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Improve English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1e9df">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm cream page, a top utility row, level pills, then a two-column hero and step cards. Single light theme by choice. */
:root{
  --bg:#f1e9df; --bg2:#f7f2ea; --ink:#1c3a2f; --muted:#5f6c63; --line:#d3cabd;
  --lime:#b7d56b; --lime-line:#97b954; --sage:#dfe4d2; --card:#faf6ef;
  --good:#2c7a4b; --good-bg:#dcefd9; --bad:#a8432c; --bad-bg:#f6dfd7;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,var(--bg2),var(--bg));background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lime-line);outline-offset:2px}
.shell{max-width:1040px;margin:0 auto;padding:16px 20px 56px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.who{font-size:14px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:10px;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.flat{border-color:transparent;background:transparent}
.menu{position:absolute;right:0;top:48px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 12px 30px rgba(28,58,47,.14)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-size:14px}
.menu button:hover,.menu button.on{background:var(--sage)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px 0 8px}
.brand{font-size:clamp(24px,5vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:8px}
.tag{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.seg{display:inline-flex;background:var(--sage);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.toggles{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.pills{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 16px;font-size:14px;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill.on{background:var(--lime);border-color:var(--lime-line);font-weight:600}
.pill .tick{margin-left:6px;color:var(--good);font-weight:700}

.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:28px 0 18px}
.hero h1{font-size:clamp(32px,5.2vw,48px);line-height:1.12;font-weight:600;letter-spacing:-.02em;margin:0 0 18px;text-wrap:balance}
.hero p{color:var(--muted);margin:0 0 24px;max-width:36ch;font-size:16px}
.primary{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:15px 22px;font-weight:600;font-size:15px}
.primary:hover{filter:brightness(1.15)}
.primary.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.status{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--muted)}

.demo{background:var(--sage);border-radius:22px;padding:28px 24px;text-align:center;cursor:pointer;border:0;width:100%;display:block;color:var(--ink)}
.demo:hover{filter:brightness(.98)}
.demo .row{display:flex;justify-content:center;align-items:center;gap:14px;font-size:clamp(22px,3.6vw,30px);font-weight:500;flex-wrap:wrap}
.demo .row.small{font-size:clamp(18px,3vw,24px)}
.demo .chip{background:var(--ink);color:#fff;border-radius:10px;padding:6px 14px;font-weight:600}
.demo .chip.wrong{background:transparent;color:var(--muted);border:2px dashed var(--muted);text-decoration:line-through}
.demo .mid{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--muted);font-size:12px}
.demo .mid:before,.demo .mid:after{content:"";flex:1;height:1px;background:var(--muted);opacity:.5}
.demo .cap{margin-top:18px;font-size:13px;color:var(--muted)}
.demo u{text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--ink)}

h2.sec{font-size:20px;margin:30px 0 14px;font-weight:600}
h2.sec span{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.step h3{margin:0;font-size:17px;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:14px}
.step .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px;gap:10px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;background:var(--sage)}
.badge.ok{background:var(--good-bg);color:var(--good)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--good)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);margin-top:18px}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.progress{height:8px;border-radius:99px;background:var(--sage);overflow:hidden;margin:14px 0 24px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.qno{font-size:13px;color:var(--muted);margin:0 0 8px}
.ask{font-size:14px;color:var(--muted);margin:0 0 12px}
.qtext{font-size:clamp(22px,4vw,32px);font-weight:500;line-height:1.35;margin:0 0 24px;text-wrap:balance}
.blank{display:inline-block;min-width:3.2ch;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;margin:0 2px}
.blank.good{border-color:var(--good);color:var(--good);font-weight:600}
.blank.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--bg2);border-radius:16px;padding:16px;font-size:18px;font-weight:500;text-align:center}
.opt:hover:not(:disabled){border-color:var(--ink);background:#fff}
.opt:disabled{cursor:default}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:22px;border-radius:16px;padding:16px 18px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb b{display:block;font-size:16px;margin-bottom:4px}
.fb p{margin:4px 0;font-size:15px}
.fb .bm{color:var(--muted);font-style:normal}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}

.score{font-size:clamp(44px,9vw,72px);font-weight:600;letter-spacing:-.03em;margin:4px 0}
.review{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.review li{background:var(--bg2);border-radius:14px;padding:12px 16px;font-size:15px}
.review li small{display:block;color:var(--muted)}

.phrase{font-size:clamp(26px,5vw,40px);font-weight:600;line-height:1.25;margin:6px 0 10px;text-wrap:balance}
.malay{color:var(--muted);font-size:17px;margin:0 0 6px}
.tip{display:inline-block;background:var(--sage);border-radius:10px;padding:6px 12px;font-size:13px;margin-top:10px}
.heard{margin-top:22px;background:var(--bg2);border-radius:16px;padding:16px 18px;font-size:18px}
.heard .w{padding:1px 3px;border-radius:6px}
.heard .w.ok{background:var(--good-bg);color:var(--good)}
.heard .w.no{background:var(--bad-bg);color:var(--bad)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);resize:vertical}
.mic.live{background:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.65}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{background:var(--sage);border-radius:999px;padding:5px 12px;font-size:13px}

.picker{max-width:520px;margin:48px auto}
.picker ul{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.picker li button{width:100%;display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:500}
.picker li button:hover{border-color:var(--ink)}
.picker .add{display:flex;gap:10px}
.picker input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:#fff;color:var(--ink)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.step .meta{flex-wrap:wrap}
.lt{font-size:clamp(22px,4vw,30px);margin:4px 0 8px;font-weight:600}
.intro{font-size:16px;margin:0 0 6px;max-width:62ch}
.blk{background:var(--bg2);border-radius:16px;padding:16px 18px;margin-top:14px}
.blk h3{margin:0 0 6px;font-size:17px;font-weight:600}
.blk p{margin:0 0 10px;font-size:15px}
.formula{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;margin:0 0 10px;font-weight:500}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ex:hover{border-color:var(--ink)}
.ex b{font-weight:600;display:block;font-size:15px}
.ex small{color:var(--muted);font-size:13px;display:block}
.tipbox{margin-top:16px;background:var(--sage);border-radius:14px;padding:12px 16px;font-size:14px}
.notes-wrap{margin-top:18px}
.bubble{max-width:88%;border-radius:16px;padding:10px 14px;margin:10px 0;background:var(--bg2);position:relative}
.bubble.me{margin-left:auto;background:var(--sage)}
.bubble.cur{outline:2px solid var(--lime-line)}
.bubble .who2{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bubble .bt{font-size:17px;font-weight:500}
.bubble .bm2{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mini{border:0;background:transparent;padding:2px 4px;margin-left:6px;vertical-align:middle;color:var(--muted)}
.mini:hover{color:var(--ink)}
.roles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;font-size:14px;color:var(--muted)}
.tcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:18px}
.tcards .step{display:flex;flex-direction:column;gap:8px}
.fixed{background:var(--sage);border-radius:14px;padding:12px 16px;margin-top:12px;font-size:17px;font-weight:500}
.chg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.chg li{background:var(--bg2);border-radius:12px;padding:8px 12px}
.chg s{color:#a33}.chg b{color:#2a6b2a}
.model{background:var(--bg2);border-radius:14px;padding:12px 16px;margin-top:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:14px;color:var(--muted)}
.seg{flex-wrap:wrap}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;gap:24px;padding-top:14px}
  .tag{display:none}
  .shell{padding:12px 16px 48px}
  .btn span.t{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>/* Grammar bank: 11 levels, each with 2 steps, each step with 4 questions.
   Q(sentence, options, answerIndex, English reason, Malay help) */
const Q = (q, o, a, e, m) => ({ q, o, a, e, m });

window.GRAMMAR = [
  { level: 1, title: "Articles and Nouns", steps: [
    { title: "a, an, the", intro: "Little words, big help.", qs: [
      Q("I eat ___ apple every day.", ["a", "an", "the"], 1, "Use an before a vowel sound.", "Guna 'an' sebelum bunyi vokal."),
      Q("He is ___ honest man.", ["a", "an", "the"], 1, "Honest starts with a vowel sound because the h is silent.", "Honest bermula dengan bunyi vokal kerana huruf h senyap."),
      Q("___ sun rises in the east.", ["A", "An", "The"], 2, "Use the for something that is one of a kind.", "Guna 'the' untuk benda yang hanya ada satu."),
      Q("My brother is ___ teacher.", ["a", "an", "the"], 0, "Use a before a consonant sound. Teacher starts with t.", "Guna 'a' sebelum bunyi konsonan.")
    ]},
    { title: "Singular, plural and uncountable", intro: "One, many, or too small to count.", qs: [
      Q("There are three ___ on the table.", ["box", "boxes", "boxs"], 1, "Add -es after x, s, sh and ch.", "Tambah -es selepas x, s, sh dan ch."),
      Q("Two ___ are playing outside.", ["child", "childs", "children"], 2, "Child has an irregular plural: children.", "Child ada bentuk jamak tidak sekata: children."),
      Q("Which word is uncountable?", ["rice", "book", "chair"], 0, "We cannot count rice one by one, so it has no plural.", "Nasi tidak boleh dikira satu-satu, jadi tiada bentuk jamak."),
      Q("The baby has two small ___.", ["tooth", "tooths", "teeth"], 2, "Tooth becomes teeth in the plural.", "Tooth menjadi teeth bila jamak.")
    ]}
  ]},
  { level: 2, title: "Pronouns and Possessives", steps: [
    { title: "Subject and object pronouns", intro: "Who does it, and who gets it.", qs: [
      Q("Amir is my friend. ___ is very kind.", ["He", "Him", "His"], 0, "Use a subject pronoun to do the action.", "Guna kata ganti subjek (he) sebagai pelaku."),
      Q("Please give the book to ___.", ["she", "her", "hers"], 1, "After a verb or a preposition, use an object pronoun.", "Selepas kata kerja atau preposisi, guna kata ganti objek."),
      Q("Siti and I are cousins. ___ live in Ipoh.", ["We", "Us", "Our"], 0, "Siti and I means we, and we is the subject.", "Siti dan saya bermaksud 'we' (kami)."),
      Q("The cat is hungry. Please feed ___.", ["it", "its", "it's"], 0, "Feed what? Feed it. It is the object here.", "'it' ialah objek bagi kata kerja feed.")
    ]},
    { title: "Possessives and this, that", intro: "Whose is it, and how far is it?", qs: [
      Q("This is ___ bag. (It belongs to me.)", ["my", "mine", "me"], 0, "My comes before a noun.", "'my' diletakkan sebelum kata nama."),
      Q("The red pen is ___.", ["my", "mine", "me"], 1, "Mine stands alone and has no noun after it.", "'mine' berdiri sendiri tanpa kata nama selepasnya."),
      Q("___ shoes over there are new.", ["This", "That", "Those"], 2, "Those is plural and far away.", "'Those' ialah jamak dan jauh."),
      Q("The dog wagged ___ tail.", ["it's", "its", "his"], 1, "Its (no apostrophe) shows ownership. It's means it is.", "'its' tanpa apostrof menunjukkan milik. 'it's' bermaksud it is.")
    ]}
  ]},
  { level: 3, title: "Verb To Be and Simple Present", steps: [
    { title: "am, is, are", intro: "The three small verbs we use all day.", qs: [
      Q("I ___ ten years old.", ["am", "is", "are"], 0, "I always goes with am.", "'I' sentiasa bersama 'am'."),
      Q("They ___ in the classroom.", ["am", "is", "are"], 2, "They is plural, so use are.", "'They' ialah jamak, jadi guna 'are'."),
      Q("She ___ not at home.", ["am", "is", "are"], 1, "He, she and it go with is.", "He, she dan it bersama 'is'."),
      Q("___ you ready?", ["Is", "Are", "Am"], 1, "You goes with are, even in questions.", "'You' bersama 'are', juga dalam soalan.")
    ]},
    { title: "Simple present", intro: "Things we do again and again.", qs: [
      Q("She ___ to school every day.", ["go", "goes", "going"], 1, "He, she and it add -s or -es to the verb.", "He, she, it menambah -s atau -es pada kata kerja."),
      Q("They ___ rice for lunch.", ["eats", "eat", "eating"], 1, "They is plural, so the verb has no -s.", "'They' jamak, jadi kata kerja tanpa -s."),
      Q("He ___ not like spicy food.", ["do", "does", "is"], 1, "He takes does in negatives. Then the verb stays in base form.", "He guna 'does' dalam ayat nafi."),
      Q("___ your mother cook every morning?", ["Do", "Does", "Is"], 1, "Mother is she, so the question starts with does.", "'Mother' ialah she, jadi soalan bermula dengan 'does'.")
    ]}
  ]},
  { level: 4, title: "Present Continuous and Simple Past", steps: [
    { title: "Present continuous", intro: "What is happening right now.", qs: [
      Q("Look! The baby ___ now.", ["sleep", "sleeps", "is sleeping"], 2, "Look and now show an action in progress: am, is or are + -ing.", "'Look' dan 'now' menunjukkan perbuatan sedang berlaku."),
      Q("We ___ a story at the moment.", ["read", "are reading", "reads"], 1, "We goes with are, then add -ing.", "We + are + kata kerja-ing."),
      Q("I ___ TV right now.", ["am not watch", "am not watching", "not watching"], 1, "Use am not + verb-ing.", "Guna am not + kata kerja-ing."),
      Q("What ___ you doing?", ["is", "are", "do"], 1, "You goes with are.", "'You' bersama 'are'.")
    ]},
    { title: "Simple past", intro: "Things that finished before today.", qs: [
      Q("Yesterday, I ___ to the market.", ["go", "went", "gone"], 1, "Go is irregular. Its past form is went.", "Go tidak sekata. Bentuk lampau ialah went."),
      Q("She ___ her homework last night.", ["finish", "finished", "finishes"], 1, "Add -ed to regular verbs in the past.", "Tambah -ed pada kata kerja sekata."),
      Q("They did not ___ to the party.", ["come", "came", "comes"], 0, "After did not, use the base verb.", "Selepas 'did not', guna kata kerja asas."),
      Q("___ you see the film last week?", ["Do", "Did", "Were"], 1, "Last week is the past, so start with did.", "'Last week' ialah masa lampau, jadi guna 'did'.")
    ]}
  ]},
  { level: 5, title: "Past Continuous, Present Perfect and Future", steps: [
    { title: "Past continuous and present perfect", intro: "Longer actions and finished experiences.", qs: [
      Q("I ___ dinner when the phone rang.", ["cooked", "was cooking", "am cooking"], 1, "A longer past action uses was or were + -ing.", "Perbuatan panjang di masa lampau: was/were + -ing."),
      Q("While they ___, it started to rain.", ["walked", "were walking", "are walking"], 1, "While often goes with the past continuous.", "'While' selalunya bersama past continuous."),
      Q("She ___ her lunch already.", ["has eaten", "ate", "is eating"], 0, "Already goes with the present perfect: have or has + past participle.", "'Already' bersama present perfect."),
      Q("We ___ here since 2020.", ["lived", "have lived", "are living"], 1, "Since shows a start point until now, so use the present perfect.", "'Since' bersama present perfect.")
    ]},
    { title: "will and going to", intro: "Talking about tomorrow.", qs: [
      Q("Look at those dark clouds. It ___ rain.", ["will", "is going to", "is"], 1, "You can see the evidence now, so use going to.", "Ada bukti sekarang, jadi guna 'going to'."),
      Q("I think she ___ pass the exam.", ["will", "is going", "does"], 0, "An opinion about the future uses will.", "Pendapat tentang masa depan guna 'will'."),
      Q("The phone is ringing. I ___ answer it.", ["am going to", "will", "answer"], 1, "A decision made at the moment of speaking uses will.", "Keputusan ketika bercakap guna 'will'."),
      Q("We ___ visit Penang next month. We booked the hotel.", ["will", "are going to", "visit"], 1, "A plan we already made uses going to.", "Rancangan yang sudah dibuat guna 'going to'.")
    ]}
  ]},
  { level: 6, title: "Modal Verbs", steps: [

<script>/* Grammar re-organised as 30 Days + 7 Appendices + Extra.
   Older questions are re-used through pick(); new questions are written with Q(). */
(function(){
const Q = (q, o, a, e, m) => ({ q, o, a, e, m });
const OLD = window.GRAMMAR; window.GRAMMAR_OLD = OLD;
const O = (l, s) => OLD[l - 1].steps[s].qs;
const pick = (l, s, idx) => idx.map(i => O(l, s)[i]);
const all = (l, s) => O(l, s);
const step = (title, intro, ...groups) => ({ title, intro, qs: [].concat(...groups) });
const lv = (n, tag, title, steps) => ({ level: n, tag, title, steps });

const days = [];

/* ---------- Day 1: Parts of Speech ---------- */
days.push(lv(1, "Day 1", "Parts of Speech", [
  step("Name the part of speech", "Noun, verb, adjective and friends.", [
    Q("In 'The cat sleeps quietly', which word is a verb?", ["cat", "sleeps", "quietly"], 1, "A verb shows an action.", "Kata kerja menunjukkan perbuatan."),

    Q("In 'He runs quickly', which word is an adverb?", ["He", "runs", "quickly"], 2, "An adverb describes a verb.", "Adverba menerangkan kata kerja."),
    Q("In 'The book is on the table', which word is a preposition?", ["book", "on", "table"], 1, "A preposition shows place, time or direction.", "Preposisi menunjukkan tempat, masa atau arah."),
    Q("In 'I like tea but she likes coffee', which word is a conjunction?", ["like", "but", "coffee"], 1, "A conjunction joins words or sentences.", "Konjungsi menghubungkan perkataan atau ayat."),
    Q("Which word is an interjection?", ["Wow!", "Table", "Quickly"], 0, "An interjection shows a sudden feeling.", "Interjeksi menunjukkan perasaan tiba-tiba.")
  ]),
  step("Articles: a, an, the", "Little words, big help.", all(1,0), pick(1,2,[2,3,4])),
  step("Nouns and possessive nouns", "One, many, or too small to count.", all(1,1), pick(1,2,[0,1,5])),
  step("Pronouns", "Who does it, and who gets it.", all(2,0), pick(2,2,[0,1,4])),
  step("Possessives and indefinite pronouns", "Whose is it, and how far is it?", all(2,1), pick(2,2,[2,3,5])),
  step("Quantifiers", "some, any, much, many, few, little.", pick(9,0,[0,1]), pick(9,2,[0,1,2,3,4])),
  step("Adjectives and adverbs", "Describe things and describe actions.", all(8,0), pick(8,2,[0,1,2,3,4])),
  step("Prepositions of time and place", "at, in and on.", all(7,0), pick(7,2,[0,3])),
  step("Prepositions of movement and fixed pairs", "Words that belong together.", all(7,1), pick(7,2,[1,2,4,5])),
  step("Conjunctions", "and, but, so, because.", all(9,1), [

    Q("You can ___ stay here or go home.", ["either", "both", "neither"], 0, "Either ... or gives a choice of two.", "'Either ... or' memberi pilihan dua.")

/* ---------- Day 2: Introduction to Tenses ---------- */
days.push(lv(2, "Day 2", "Introduction to Tenses", [
  step("Past, present or future?", "Spot the time in the sentence.", [
    Q("'Yesterday I visited my aunt.' Which tense is this?", ["Simple past", "Simple present", "Simple future"], 0, "Yesterday and the -ed verb show the past.", "'Yesterday' dan kata kerja -ed menunjukkan masa lampau."),
    Q("'She goes to school every day.' Which tense is this?", ["Simple present", "Simple past", "Present continuous"], 0, "Every day shows a habit in the present.", "'Every day' menunjukkan tabiat sekarang."),
    Q("'We will travel next week.' Which tense is this?", ["Simple future", "Simple past", "Present perfect"], 0, "Will + verb talks about the future.", "'Will' + kata kerja untuk masa depan."),

days.push(lv(3, "Day 3", "Simple Present Tense", [

  step("have and has + past participle", "Experience, result and up to now.", pick(5,0,[2,3]), pick(5,2,[4]), [
    Q("Have you ___ your homework yet?", ["finish", "finished", "finishing"], 1, "Have you + past participle.", "Have you + past participle."),

/* ---------- Day 6: Present Perfect Continuous ---------- */
days.push(lv(6, "Day 6", "Present Perfect Continuous Tense", [
  step("have been + -ing", "How long something has been going on.", pick(5,2,[0,1,3]), [
    Q("She is tired because she ___ all day.", ["has been working", "has worked", "is working"], 0, "An action that continued until now uses have/has been + -ing.", "Perbuatan berterusan hingga kini: have/has been + -ing."),
    Q("They have been ___ for the bus since 8 o'clock.", ["wait", "waiting", "waited"], 1, "Have been + -ing.", "Have been + -ing."),
    Q("I have been ___ English for two years.", ["learn", "learning", "learned"], 1, "Have been + -ing.", "Have been + -ing."),
    Q("It ___ raining all morning.", ["has been", "have been", "is"], 0, "It takes has been.", "'It' guna 'has been'.")

]));

/* ---------- Day 7: Simple Past ---------- */
days.push(lv(7, "Day 7", "Simple Past Tense", [
  step("Finished actions", "Regular and irregular verbs.", all(4,1), pick(4,2,[2]), [
    Q("She ___ me a nice gift.", ["gave", "given", "gived"], 0, "Give - gave - given.", "Give - gave - given."),

<script>/* Tools: rule-based grammar checker, fix-the-sentence practice, translation practice. */
(function(){
const T = window.TOOLS = {};
const irr = {went:'go',ate:'eat',saw:'see',took:'take',came:'come',had:'have',did:'do',made:'make',gave:'give',got:'get',bought:'buy',knew:'know',thought:'think',wrote:'write',ran:'run',spoke:'speak',taught:'teach',met:'meet',told:'tell',said:'say',drank:'drink',slept:'sleep',read:'read'};
const past = {go:'went',eat:'ate',see:'saw',buy:'bought',have:'had',come:'came',take:'took',meet:'met',do:'did',make:'made',get:'got',give:'gave',write:'wrote',drink:'drank',sleep:'slept',play:'played',watch:'watched',visit:'visited',study:'studied',cook:'cooked',clean:'cleaned',walk:'walked',call:'called',help:'helped',work:'worked',like:'liked',want:'wanted',need:'needed'};
const third = v => ({go:'goes',do:'does',have:'has',"don't":"doesn't",study:'studies',teach:'teaches',watch:'watches',fix:'fixes',pass:'passes'}[v] || (v + 's'));
/* each rule: [regex, replacement (string or fn), BM note] */
const R = [
 [/\b(he|she|it|[A-Z][a-z]+)\s+(go|do|have|don't|like|want|need|work|live|play|eat|study|come|make|take|know|think|read|teach|love|get|see|watch|cook|drink|sleep|speak)\b/g,
  (m, s, v) => (/^[A-Z]/.test(s) && !/^(He|She|It)$/.test(s) && !['Mother','Father','Mum','Dad','Ali','Sara','Siti','Ahmad','Teacher','Mary','John'].includes(s)) ? m : s + ' ' + third(v),
  'Subject he / she / it (satu orang) + verb tambah -s / -es. Contoh: She goes, He doesn\'t like.'],
 [/\b(I|you|we|they)\s+(goes|does|has|doesn't|likes|wants|needs|works|lives|plays|eats|studies|comes|makes|takes|knows|thinks|reads|teaches|loves|gets|sees|watches)\b/gi,
  (m, s, v) => { const b = {goes:'go',does:'do',has:'have',"doesn't":"don't",studies:'study',teaches:'teach',watches:'watch'}[v.toLowerCase()] || v.slice(0, -1); return s + ' ' + b; },
  'I / you / we / they guna verb asal tanpa -s. Contoh: They go, I don\'t know.'],
 [/\b(am|is|are)\s+(agree|like|love|know|want|need|go|come|think|understand|live|work)\b/gi, (m, a, v) => v, 'Jangan letak am / is / are sebelum verb biasa. Cakap: I agree (bukan I am agree).'],
 [/\bmore (better|faster|bigger|cheaper|easier|taller|smaller|taller|older|younger|cleaner|harder|slower|lower|higher)\b/gi, (m, w) => w, 'Adjektif yang sudah ada -er tak perlu "more". Cakap: better, taller.'],
 [/\bmost (best|worst|biggest|easiest|fastest|tallest)\b/gi, (m, w) => w, 'Superlative tak perlu "most" lagi. Cakap: the best.'],
 [/\bdiscuss(ed|es|ing)? about\b/gi, (m, e) => 'discuss' + (e || ''), '"Discuss" sudah bermaksud berbincang tentang. Tak perlu "about".'],
 [/\b(return|reply|revert) back\b/gi, (m, v) => v, '"Return" sudah bermaksud kembali. Tak perlu "back".'],
 [/\b(didn't|did not|doesn't|does not|don't|do not|can't|cannot|couldn't|won't|will not|should|must|can|could|will|would|may|might)\s+(went|ate|saw|took|came|had|did|made|gave|got|bought|knew|thought|wrote|ran|spoke|taught|met|told|drank|slept)\b/gi,
  (m, a, v) => a + ' ' + irr[v.toLowerCase()], 'Selepas did / didn\'t / do / does / modal (can, will, must...) guna verb asal (base form), bukan past tense.'],
 [/\b(can|could|will|would|should|must|may|might)\s+to\s+/gi, (m, a) => a + ' ', 'Selepas modal (can, will, must...) tak perlu "to". Cakap: I can swim.'],
 [/\bcan able to\b/gi, 'can', 'Pilih satu sahaja: "can" atau "be able to".'],
 [/\b(many|a lot of) (informations|advices|furnitures|homeworks|equipments|luggages)\b/gi, (m, q, n) => q + ' ' + n.slice(0, -1), 'Noun ini tak boleh dikira, tiada bentuk jamak -s. Contoh: information, advice.'],
 [/\b(informations|advices|furnitures|homeworks|equipments|luggages)\b/gi, n => n.slice(0, -1), 'Noun ini tak boleh dikira, tiada bentuk jamak -s. Contoh: information, advice.'],
 [/\bmany (money|water|rice|information|advice|homework|traffic|time|work)\b/gi, (m, n) => 'much ' + n, 'Noun tak boleh dikira guna "much", bukan "many".'],
 [/\bmuch (friends|people|books|students|children|cars|questions|mistakes)\b/gi, (m, n) => 'many ' + n, 'Noun boleh dikira (jamak) guna "many", bukan "much".'],
 [/\b(they|we|you|people|children|students|friends)\s+is\b/gi, (m, s) => s + ' are', 'Subject jamak (they, we, you, people) guna "are".'],
 [/\bI\s+(is|are)\b/g, 'I am', 'Dengan "I" guna "am".'],
 [/\b(he|she|it)\s+(are|am)\b/gi, (m, s) => s + ' is', 'He / she / it guna "is".'],
 [/\bthere is (many|several|two|three|four|five|six|seven|eight|nine|ten)\b/gi, (m, q) => 'there are ' + q, 'Bilangan banyak guna "there are".'],
 [/\b(said|say) me\b/gi, (m, v) => (v.toLowerCase() === 'said' ? 'told' : 'tell') + ' me', 'Guna "tell + orang": He told me. "Said" tak diikuti terus oleh orang.'],
 [/\b(open|close) the (light|fan|tv|television|aircond|air-cond)\b/gi, (m, v, o) => 'switch ' + (v.toLowerCase() === 'open' ? 'on' : 'off') + ' the ' + o, 'Untuk alat elektrik guna "switch on / switch off" (turn on / turn off), bukan open / close.'],
 [/\bI very (like|love)\b/g, (m, v) => 'I really ' + v, 'Jangan cakap "I very like". Cakap: I really like / I like it very much.'],
 [/\b(I am|I'm|am) (boring)\b/gi, (m, a) => a + ' bored', '"Bored" = rasa bosan. "Boring" = benda yang membosankan.'],
 [/\b(am|is|are|I'm) interesting in\b/gi, (m, a) => a + ' interested in', '"Interested in" = berminat. "Interesting" = menarik.'],
 [/\blisten (music|radio|songs?|to the)\b/gi, (m, w) => w === 'to the' ? m : 'listen to ' + w, 'Guna "listen to": listen to music.'],

 [/\b(has|have) married with\b/gi, 'is married to', 'Guna "is married to" atau "has married + orang".'],
 [/\bmarried with\b/gi, 'married to', 'Guna "married to".'],
 [/\binteresting in\b/gi, 'interested in', '"Interested in" = berminat. "Interesting" = menarik.'],
 [/\ban (university|uniform|union|unit|universe|european|useful|user|one)\b/gi, (m, w) => 'a ' + w, 'University, uniform, useful bunyi "yoo" (konsonan), jadi guna "a".'],
 [/\b(my|his|her|the|our) (father|mother|brother|sister|friend|teacher|dad|mum|uncle|aunt) (work|live|like|go|have|play|study|teach|come|eat|want|need)\b/gi, (m, d, n, v) => d + ' ' + n + ' ' + third(v.toLowerCase()), 'Subject satu orang (my father, the teacher) = he / she, verb perlu -s / -es.'],
 [/\b(can|could|will|would|should|must|may|might)\s+(speaks|goes|plays|eats|comes|makes|takes|reads|writes|works|helps|likes|knows|sees|gets|has|does)\b/gi, (m, a, v) => a + ' ' + ({goes:'go',has:'have',does:'do'}[v.toLowerCase()] || v.slice(0, -1)), 'Selepas modal (can, will, must...) guna verb asal tanpa -s.'],
 [/\b(we|you|they) was\b/gi, (m, s) => s + ' were', 'We / you / they guna "were" (past).'],
 [/\b(do|does) (you|they|we|he|she|I) (went|ate|saw|took|came|had|made|bought|knew|wrote)\b/gi, (m, d, s, v) => 'Did ' + s + ' ' + irr[v.toLowerCase()], 'Soalan masa lampau guna "Did + subject + verb asal".'],
 [/\b(I|you|we|they) (waiting|going|playing|reading|eating|watching|studying|working|doing|cooking|sleeping|learning|looking|talking)\b/g, (m, s, v) => (s === 'I' ? 'I am ' : s + ' are ') + v, 'Present continuous: am / is / are + verb-ing.'],
 [/\b(he|she) (waiting|going|playing|reading|eating|watching|studying|working|doing|cooking|sleeping|learning|looking|talking)\b/gi, (m, s, v) => s + ' is ' + v, 'Present continuous: am / is / are + verb-ing.'],
 [/\bmore (smarter|cleverer|prettier|happier|stronger|busier|funnier|nicer|wider|longer|shorter|louder|quieter|healthier)\b/gi, (m, w) => w, 'Adjektif yang sudah ada -er tak perlu "more".'],
 [/\b(enjoy|enjoys|enjoyed|finish|finished|avoid|mind|keep|kept) to (\w+?)(e?)\b/gi, (m, a, v, e) => a + ' ' + v + (e ? '' : '') + 'ing', 'Selepas enjoy / finish / avoid / mind guna verb + -ing.'],
 [/\bthe news (are|were)\b/gi, (m, v) => 'the news ' + (v === 'are' ? 'is' : 'was'), '"News" ialah tunggal.'],
 [/^Me and (my \w+)\b/, (m, w) => w.charAt(0).toUpperCase() + w.slice(1) + ' and I', 'Sebagai subject guna "I", dan letak diri di belakang.'],
 [/\bif (it|he|she) will (\w+)\b/gi, (m, s, v) => 'if ' + s + ' ' + third(v), 'Ayat "if" guna present simple, bukan will.'],
 [/\bif (I|you|we|they) will (\w+)\b/gi, (m, s, v) => 'if ' + s + ' ' + v, 'Ayat "if" guna present simple, bukan will.'],
 [/\bdepends? of\b/gi, m => m.replace(/of/i, 'on'), 'Guna "depend on".'],
 [/\bdifferent with\b/gi, 'different from', 'Guna "different from".'],
 [/\bexplain me\b/gi, 'explain to me', 'Guna "explain to + orang".'],

};

<script>
(function(){

/* ---------- storage (falls back to memory) ---------- */

    const wrong = q.o.find((_,i) => i !== q.a);

    const line = (chip, cls) => q.q.split('___').map((p,i,a) => esc(p) + (i < a.length-1 ? `<span class="chip ${cls}">${esc(chip)}</span>` : '')).join('');
    return `<button class="demo" data-act="demo" aria-label="Listen to the example sentence">
      <div class="row small">${line(wrong,'wrong')}</div>
      <div class="mid">one little change</div>
      <div class="row">${line(right,'')}</div>
      <div class="cap">Please tap to listen to the sentence.</div></button>`;
  }
  const p = lvl().phrases[0];
  return `<button class="demo" data-act="demo" aria-label="Listen to the example phrase">
    <div class="row small"><span class="chip wrong">${esc(p.m)}</span></div>

function notesHtml(L, s){
  const key = L + '-' + s;
  const nt = (window.NOTES || {})[key]; if (!nt) return '';
  const spk = t => (key === '29-0' || key === '30-0') ? t.split(' - ').pop() : t.replace(/ - /g, '. ').replace(/ = /g, ', ').replace(/\([^)]*\)/g, '');
  const blocks = nt.blocks.map(b => `<section class="blk"><h3>${esc(b.h)}</h3><p>${esc(b.t)}</p>${b.f ? `<span class="formula">${esc(b.f)}</span>` : ''}${b.ex.length ? `<ul class="exs">${b.ex.map(x => `<li><button class="ex" data-act="exsay" data-t="${esc(spk(x[0]))}">${ico('vol')}<span><b>${esc(x[0])}</b>${x[1] ? `<small>${esc(x[1])}</small>` : ''}</span></button></li>`).join('')}</ul>` : ''}</section>`).join('');

/* ----- grammar quiz ----- */
function startQuiz(L, s){
  const st = bank()[L-1].steps[s];
  const qs = st.qs.map(q => {
    const order = shuffle(q.o.map((_,i) => i));
    return { q:q.q, o:order.map(i => q.o[i]), a:order.indexOf(q.a), e:q.e, m:q.m };
  });
  S.quiz = { L, s, title:st.title, qs, i:0, sel:null, score:0, missed:[] };
  S.view = 'quiz'; render();
}
function quiz(){
  const Z = S.quiz; const q = Z.qs[Z.i]; const ans = Z.sel !== null;
  const parts = q.q.split('___');
  const blankTxt = ans ? q.o[q.a] : '&nbsp;&nbsp;&nbsp;';
  const bc = ans ? (Z.sel === q.a ? 'good' : 'bad') : '';
  let sentence;
  if (!q.q.includes('___')) sentence = esc(q.q);
  else if (ans && Z.sel !== q.a) sentence = esc(parts[0]) + `<span class="blank bad">${esc(q.o[Z.sel])}</span><span class="blank good">${esc(q.o[q.a])}</span>` + esc(parts[1]||'');
  else sentence = esc(parts[0]) + `<span class="blank ${bc}">${ans ? esc(blankTxt) : blankTxt}</span>` + esc(parts[1]||'');
  const opts = q.o.map((t,i) => {
    let c = ''; if (ans){ if (i === q.a) c = 'good'; else if (i === Z.sel) c = 'bad'; }
    return `<button class="opt ${c}" data-act="pick" data-v="${i}" ${ans?'disabled':''}>${esc(t)}</button>`;
  }).join('');
  const last = Z.i === Z.qs.length - 1;
  const fb = ans ? `<div class="fb ${Z.sel===q.a?'good':'bad'}" role="status">
      <b>${Z.sel===q.a?'Well done! That is correct.':'Nearly there. The answer is "'+esc(q.o[q.a])+'".'}</b>
      <p>${esc(q.e)}</p>${S.bm?`<p class="bm">BM: ${esc(q.m)}</p>`:''}</div>
    <div class="actions">
      <button class="btn" data-act="say">${ico('vol')}Listen</button>
      <button class="primary" data-act="next">${last?'See my result':'Next question'}${ico('arrow')}</button></div>` : '';
  app.innerHTML = topBar() + `<div class="crumb"><button class="btn" data-act="home">${ico('back')}${esc(tagOf('grammar', window.GRAMMAR[Z.L-1]))}</button><span class="who">${esc(Z.title)}</span><button class="btn" data-act="qnotes" aria-expanded="${!!Z.showNotes}">Penerangan</button></div>
    ${Z.showNotes ? '<div class="panel notes-wrap"><p class="qno">Penerangan &middot; Explanation</p>' + notesHtml(Z.L, Z.s) + '</div>' : ''}
    <div class="panel">
      <p class="qno">Question ${Z.i+1} of ${Z.qs.length}</p>
      <div class="progress" aria-hidden="true"><i style="width:${(Z.i + (ans?1:0))/Z.qs.length*100}%"></i></div>
      <p class="ask">Please read the sentence, then choose the best word.</p>
      <p class="qtext">${sentence}</p>
      <div class="opts">${opts}</div>${fb}</div>`;
}
function quizResult(){
  const Z = S.quiz; const n = Z.qs.length;
  const key = Z.L+'-'+Z.s; const p = me();
  p.d[key] = Math.max(p.d[key] || 0, Z.score); save();
  const msg = Z.score === n ? 'Wonderful! Every answer is correct.' : Z.score >= Math.ceil(n*0.75) ? 'Great work! This step is complete.' : 'Good try. Please practise this step once more.';
  const miss = Z.missed.length ? `<h2 class="sec">Let us review</h2><ul class="review">${Z.missed.map(q => `<li>${esc(reviewLine(q))}<small>${esc(q.e)}${S.bm?' &middot; BM: '+esc(q.m):''}</small></li>`).join('')}</ul>` : '';
  const sq = seq(); const idx = sq.findIndex(x => x.L === Z.L && x.s === Z.s);
  const nx = sq[idx+1];
  app.innerHTML = topBar() + `<div class="crumb"><button class="btn" data-act="home">${ico('back')}${esc(tagOf('grammar', window.GRAMMAR[Z.L-1]))}</button><span class="who">${esc(Z.title)}</span></div>
    <div class="panel"><p class="qno">Your result</p><div class="score">${Z.score}/${n}</div><p class="qtext">${msg}</p>
    <div class="actions"><button class="primary ghost" data-act="again">${ico('redo')}Try again</button>
    ${nx?`<button class="primary" data-act="gonext">${esc(nx.title)}${ico('arrow')}</button>`:''}
    <button class="btn" data-act="home">Back to steps</button></div>${miss}</div>`;
}

    body = `<p class="qno">Translate</p><h2 class="lt">Type a word or sentence</h2>
      <div class="seg" role="group" aria-label="Direction">${seg}</div>
      <textarea id="tin" aria-label="Type a word or sentence to translate" placeholder="Example: reluctant, or: Saya nak tempah bilik hotel">${esc(Tt.text)}</textarea>
      <div class="actions"><button class="primary" data-act="ttrans" ${Tt.busy ? 'disabled' : ''}>${ico('tr')}Translate</button><button class="btn" data-act="tclear">Clear</button></div>${out}`;
  } else {
    const done = Tt.i >= Tt.items.length;
    if (done){
      body = `<p class="qno">Round complete</p><h2 class="lt">${Tt.good} of ${Tt.items.length} were good</h2>
        <p class="ask">${Tt.good >= 8 ? 'Excellent work!' : Tt.good >= 5 ? 'Nice effort. Try another round.' : 'Good try. Another round will help.'}</p>
        <div class="actions"><button class="primary" data-act="tool" data-v="${Tt.kind}">New round${ico('arrow')}</button><button class="btn" data-act="tools_home">Back</button></div>`;
    } else {
      const it = Tt.items[Tt.i]; const fix = Tt.kind === 'fix';
      const label = fix ? 'Fix the mistake' : Tt.kind === 'en2bm' ? 'Translate into Bahasa Melayu' : 'Translate into English';
      let fb = '';
      if (Tt.res){
        const r = Tt.res;
        const mk = r.cmp.tw.map((w, k) => `<span class="w ${r.cmp.marks[k] ? 'ok' : 'no'}">${esc(w)}</span>`).join(' ');
        fb = `<div class="heard" role="status"><p class="note"><b>${r.good ? 'Bagus! That works.' : 'Almost. Compare with the model answer.'}</b></p><div class="model"><b>Model answer</b><br>${mk}
          ${(!fix && Tt.kind === 'bm2en') || fix ? `<button class="mini" data-act="tsay" data-t="${esc(r.model)}" aria-label="Listen">${ico('vol')}</button>` : ''}</div>
          ${it[1].length > 1 ? `<p class="note">Other good answers: ${it[1].filter(a => a !== r.model).map(esc).join(' / ')}</p>` : ''}
          ${fix && it[2] ? `<p class="note">${esc(it[2])}</p>` : ''}</div>
          <div class="actions"><button class="primary" data-act="tnext">${Tt.i === Tt.items.length - 1 ? 'See result' : 'Next'}${ico('arrow')}</button></div>`;
      }
      body = `<p class="qno">${label} &middot; ${Tt.i + 1} of ${Tt.items.length}</p><div class="progress" aria-hidden="true"><i style="width:${Tt.i / Tt.items.length * 100}%"></i></div>
        <p class="phrase">${esc(fix ? it[0] : it[0])}</p>
        ${fix && S.bm ? `<p class="malay">${esc(it[2] || '')}</p>` : ''}
        <textarea id="tin" aria-label="Type your answer" placeholder="Type your answer here..." ${Tt.res ? 'readonly' : ''}>${esc(Tt.text)}</textarea>
        ${Tt.res ? '' : `<div class="actions"><button class="primary" data-act="tans">${ico('check')}Check answer</button><button class="btn" data-act="tshow">Show answer</button></div>`}${fb}`;
    }
  }
  app.innerHTML = topBar() + crumb + `<div class="panel">${body}</div>`;
}
/* ----- free web helpers (used when the Claude AI helper is not available, e.g. on GitHub Pages) ----- */
const MS_WORDS = new Set('saya awak anda kami kita mereka dia ia yang dan di ke dari itu ini tidak tak nak mahu dengan untuk ada apa boleh pada akan sudah dah sedang telah hari esok semalam tolong sila terima kasih maaf tidur makan minum pergi datang rumah sekolah kerja bila mana kenapa bagaimana macam sangat sikit banyak lagi juga atau tetapi kerana sebab jom mari saja sahaja punya lah kah'.split(' '));
const detectLang = t => { const w = words(t); let n = 0; w.forEach(x => { if (MS_WORDS.has(x)) n++; }); return n > 0 ? 'ms' : 'en'; };
const unent = s => String(s || '').replace(/&#39;|&apos;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
async function getJson(url, opts){ const r = await fetch(url, opts); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
async function freeTranslate(text, dir){
  const from = dir === 'en2bm' ? 'en' : dir === 'bm2en' ? 'ms' : detectLang(text); const to = from === 'en' ? 'ms' : 'en';
  if (text.length > 450) return { error:'Please type a shorter text (under about 450 characters) for the free translator.' };
  try {
    const j = await getJson('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to);
    const tr = unent(j && j.responseData && j.responseData.translatedText);
    if (!tr || String(j.responseStatus) !== '200') return { error:'Sorry, the free translator is busy or has reached its daily limit. Please try again later.' };
    const entries = []; const seen = new Set([normS(tr)]);
    const short = words(text).length <= 3;
    if (short){
      (j.matches || []).forEach(m => { const t = unent(m.translation); if (t && !seen.has(normS(t)) && entries.length < 3 && words(t).length <= 4){ seen.add(normS(t)); entries.push({ pos:'Other meaning', meaning:t }); } });
      const en = from === 'en' ? text : (words(tr).length === 1 ? tr : '');
      if (en){
        try {
          const d = await getJson('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(en.trim().toLowerCase()));
          let n = 0; (d[0].meanings || []).forEach(mn => { const df = (mn.definitions || [])[0]; if (df && n < 3){ n++; entries.push({ pos:mn.partOfSpeech, meaning:df.definition, example_en:df.example || '' }); } });
        } catch (_) {}
      }
    }
    return { from, to, translation:tr, alt:'', entries, notes: short ? 'Definition lines are in English. The translation is from a free online translator, so please check important sentences.' : 'This is from a free online translator, so please check important sentences.' };
  } catch (_) { return { error:'Sorry, I could not reach the translator. Please check your internet and try again.' }; }
}
async function ltCheck(text){
  try {
    const j = await getJson('https://api.languagetool.org/v2/check', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:'language=en-US&text=' + encodeURIComponent(text) });
    const cat = { GRAMMAR:'Tatabahasa', TYPOS:'Ejaan', PUNCTUATION:'Tanda baca', CASING:'Huruf besar/kecil', CONFUSED_WORDS:'Perkataan keliru', COLLOCATIONS:'Gabungan perkataan', TYPOGRAPHY:'Tipografi', SEMANTICS:'Makna' };
    const ms = (j.matches || []).filter(m => m.replacements && m.replacements.length && m.rule && m.rule.issueType !== 'style').sort((a, b) => b.offset - a.offset);
    let out = text; const ch = [];
    ms.forEach(m => { const rep = m.replacements[0].value; const orig = out.substr(m.offset, m.length); if (out.substr(m.offset, m.length) === text.substr(m.offset, m.length)){ out = out.slice(0, m.offset) + rep + out.slice(m.offset + m.length); ch.unshift([orig, rep, (cat[m.rule.category && m.rule.category.id] || 'Semakan') + ': ' + m.message]); } });
    return { out, changes:ch };
  } catch (_) { return null; }
}
async function getSample(){ try { return (window.claude && window.claude.use) ? await window.claude.use('sample') : null; } catch (_) { return null; } }
async function askJson(smp, prompt){
  let r;
  if (typeof smp.json === 'function'){ r = await smp.json(prompt, { cache:false }); return r; }
  r = await smp(prompt, { cache:false }); const m = String(r.text || '').match(/\{[\s\S]*\}/); return JSON.parse(m[0]);
}
async function aiCheck(){
  const Tt = S.tool; const text = (Tt.text || '').trim();
  if (!text){ Tt.res = { empty:true }; render(); return; }
  Tt.busy = true; Tt.res = null; render();
  const smp = await getSample(); let res = null;
  if (smp){
    try {
      const j = await askJson(smp, `You are a kind English teacher for a Malaysian adult learner (writes Manglish). Check the sentence between the markers. Fix grammar, spelling, word choice and punctuation. Keep the meaning and keep it simple. Explain each change in simple Bahasa Melayu (one short sentence each, you may keep key English terms). Reply with JSON only, in this shape: {"corrected": string, "changes": [{"from": string, "to": string, "why_bm": string}], "natural": string}. "changes" is empty if the sentence is already correct. "natural" is an optional more natural way to say it, or an empty string.\n\n<<<\n${text}\n>>>`);
      res = { ai:true, out:String(j.corrected || text), changes:(j.changes || []).map(c => [String(c.from || ''), String(c.to || ''), String(c.why_bm || '')]), natural:String(j.natural || '') };
      if (normS(res.natural) === normS(res.out)) res.natural = '';
    } catch (_) { res = null; }
  }
  if (!res){
    const base = window.TOOLS.check(text); const lt = await ltCheck(base.out);
    res = lt ? { ai:true, out:lt.out, changes:base.notes.concat(lt.changes), natural:'' } : base;
  }
  Tt.busy = false; Tt.res = res; if (S.tool === Tt) render();
}
async function aiTranslate(){
  const Tt = S.tool; const text = (Tt.text || '').trim();
  if (!text){ Tt.res = { empty:true }; render(); return; }
  Tt.busy = true; Tt.res = null; render();
  const smp = await getSample(); let res = null;
  if (!smp) res = await freeTranslate(text, Tt.dir);
  else {
    const dirTxt = Tt.dir === 'en2bm' ? 'The text is English; translate to Bahasa Melayu (Malaysia).' : Tt.dir === 'bm2en' ? 'The text is Bahasa Melayu; translate to English.' : 'Detect whether the text is English or Bahasa Melayu, then translate to the other language (Malaysia usage).';
    try {
      const j = await askJson(smp, `You are a translator and dictionary for a Malaysian learner. ${dirTxt}\nIf the text is a single word or short phrase, give up to 3 meanings in "entries" (pos = part of speech, meaning = the translation, example_en = a simple English example, example_bm = its Malay translation). For a full sentence, leave "entries" empty and give "alt" with one other natural way to say it if useful. Use "notes" for a short tip in simple Bahasa Melayu (empty if not needed). Reply with JSON only: {"from": "en" or "ms", "to": "en" or "ms", "translation": string, "alt": string, "entries": [{"pos": string, "meaning": string, "example_en": string, "example_bm": string}], "notes": string}.\n\n<<<\n${text}\n>>>`);
      const from = j.from === 'ms' || j.from === 'bm' ? 'ms' : 'en';
      res = { from, to: from === 'en' ? 'ms' : 'en', translation:String(j.translation || ''), alt:String(j.alt || ''), entries:j.entries || [], notes:String(j.notes || '') };
      if (!res.translation) res = await freeTranslate(text, Tt.dir);
    } catch (_) { res = await freeTranslate(text, Tt.dir); }
  }
  Tt.busy = false; Tt.res = res; if (S.tool === Tt) render();
}
function toolAnswer(show){
  const Tt = S.tool; const it = Tt.items[Tt.i]; const fix = Tt.kind === 'fix';
  const txt = (Tt.text || '').trim();
  if (!txt && !show){ Tt.msgEmpty = true; return false; }
  const accepted = fix ? it[1] : it[1];
  let best = accepted[0], bestS = -1;
  accepted.forEach(a => { const c = compare(a, txt); const sc = c.score - (words(txt).length > words(a).length * 1.6 ? 0.2 : 0); if (sc > bestS){ bestS = sc; best = a; } });
  const exact = accepted.some(a => normS(a) === normS(txt));
  const cmp = compare(best, txt);
  const good = !show && (exact || (!fix && cmp.score >= 0.75 && words(txt).length <= words(best).length * 1.6));
  if (good) Tt.good++;
  Tt.res = { good, model:best, cmp };
  return true;
}
/* ----- learners ----- */
function picker(){
  const items = S.learners.map(l => {
    const n = doneCount(l);
    return `<li><button data-act="pickl" data-v="${l.id}"><span>${esc(l.name)}</span><span class="badge ${l.id===S.cur&&!S.signedOut?'ok':''}">${n} steps done</span></button></li>`;
  }).join('');
  app.innerHTML = `<div class="picker"><div class="brand">Let's Improve English<small>Little steps, clearer English.</small></div>
    <h2 class="sec">${S.signedOut?'You are signed out. Who is learning?':'Who is learning today?'}</h2>
    <ul>${items}</ul>
    <form class="add" id="addform"><input id="newname" aria-label="New learner name" placeholder="Add a learner name" maxlength="24"><button class="primary" type="submit">Add</button></form>
    <p class="note">Progress is saved on this device for each learner.</p>
    ${S.signedOut?'':'<div class="actions"><button class="btn" data-act="home">'+ico('back')+'Back</button></div>'}</div>`;
}

function render(){
  stopRec();
  if (S.view === 'picker') picker();
  else if (S.view === 'quiz') (S.quiz.i >= S.quiz.qs.length) ? quizResult() : quiz();
  else if (S.view === 'lesson') lesson();
  else if (S.view === 'speak') speak_view();
  else if (S.mode === 'tools') (S.tool ? toolView() : toolsHome());
  else home();
}

/* ---------- events ---------- */
function setMode(m){ if (m === 'tools'){ S.mode = 'tools'; S.view = 'home'; S.tool = null; S.menu = false; render(); return; } S.mode = m; S.level = 1; S.menu = false; S.view = 'home'; const n = nextStep(); S.level = n.item.L; render(); }
app.addEventListener('submit', e => {
  if (e.target.id === 'addform'){
    e.preventDefault();
    const v = document.getElementById('newname').value.trim();
    if (!v) return;
    const id = Math.max.apply(null, S.learners.map(l => l.id)) + 1;
    S.learners.push({id, name:v, d:{}, s:{}}); S.cur = id; S.signedOut = false; S.view = 'home'; save(); render();
  }
});
app.addEventListener('input', e => { if (e.target.id === 'tin' && S.tool) S.tool.text = e.target.value; if (e.target.id === 'typed' && S.sp) S.sp.typed = e.target.value; });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b){ if (S.menu){ S.menu = false; render(); } return; }
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case 'menu': S.menu = !S.menu; render(); break;
    case 'mode': setMode(v); break;
    case 'level': S.level = +v; render(); break;
    case 'bm': S.bm = !S.bm; save(); render(); break;
    case 'audio': S.audio = !S.audio; if (!S.audio){ try{speechSynthesis.cancel();}catch(_){} } save(); render(); break;
    case 'learners': S.view = 'picker'; S.menu = false; render(); break;
    case 'signout': S.signedOut = true; S.view = 'picker'; render(); break;
    case 'pickl': S.cur = +v; S.signedOut = false; S.view = 'home'; save(); { const n = nextStep(); S.level = n.item.L; } render(); break;
    case 'home': S.view = 'home'; render(); break;
    case 'demo': {
      if (S.mode === 'grammar'){ const q = demoQ(); forceSpeak(filled(q, q.o[q.a])); }
      else forceSpeak(lvl().phrases[0].t);
      break; }
    case 'continue': {
      const n = nextStep(); S.level = n.item.L;
      if (S.mode === 'grammar') openStep(n.item.L, n.item.s); else startSpeak(n.item.L);
      break; }
    case 'start': if (S.mode === 'grammar') openStep(S.level, +b.dataset.s); else startSpeak(S.level); break;
    case 'notes': openStep(S.level, +b.dataset.s); break;
    case 'beginq': startQuiz(S.lesson.L, S.lesson.s); break;
    case 'qnotes': S.quiz.showNotes = !S.quiz.showNotes; render(); break;
    case 'exsay': forceSpeak(b.dataset.t, 0.9); break;
    /* dialogue */
    case 'dhearn': { const D = lvl_sp().dialog; const ln = D.lines[+b.dataset.k]; forceSpeak(ln[1], 0.92, ln[0] === 0 ? 1 : 1.25); break; }
    case 'drole': { const dl = S.sp.dl; dl.role = dl.role ? 0 : 1; dl.i = 0; dl.heard = null; dl.res = null; dl.msg = ''; render(); dlAuto(); break; }
    case 'drestart': { const dl = S.sp.dl; dl.i = 0; dl.heard = null; dl.res = null; dl.msg = ''; render(); dlAuto(); break; }
    case 'dsaid': { const dl = S.sp.dl; dl.msg = 'Great job!'; render(); break; }
    case 'dmic': {
      const X = S.sp; const dl = X.dl; const ln = lvl_sp().dialog.lines[dl.i]; dl.state = 'listening'; dl.msg = ''; render();
      listen(txt => { dl.state = 'idle'; dl.heard = txt; dl.res = compare(ln[1], txt); dl.msg = dl.res.score >= 0.7 ? 'Lovely! Tap Next line.' : 'Good try. Listen once more and try again.'; render(); },
        err => { dl.state = 'idle'; dl.msg = (err === 'not-allowed' || err === 'service-not-allowed' || err === 'unsupported') ? 'The microphone is not available here. Please say the line aloud, then tap "I said it".' : 'Sorry, I could not hear you. Please try again.'; render(); });
      break; }
    case 'dnext': {
      const X = S.sp; const dl = X.dl; const D = lvl_sp().dialog;
      if (dl.i >= D.lines.length - 1){ const m = me(); m.s[X.L + 'd'] = true; save(); X.p++; X.dl = null; render(); window.scrollTo(0,0); break; }
      dl.i++; dl.heard = null; dl.res = null; dl.msg = ''; render(); dlAuto(); break; }
    case 'quick': S.mode = 'tools'; S.menu = false; startTool(v); break;
    case 'tool': startTool(v); break;
    case 'tools_home': S.tool = null; render(); break;
    case 'tcheck': aiCheck(); break;
    case 'ttrans': aiTranslate(); break;
    case 'tdir': S.tool.dir = v; render(); break;
    case 'tclear': S.tool.text = ''; S.tool.res = null; render(); break;
    case 'tsay': forceSpeak(b.dataset.t, 0.92); break;
    case 'tans': if (toolAnswer(false)) render(); else { S.tool.msgEmpty = false; } break;
    case 'tshow': toolAnswer(true); render(); break;
    case 'tnext': { const Tt = S.tool; Tt.i++; Tt.text = ''; Tt.res = null; render(); window.scrollTo(0,0); break; }
    /* quiz */
    case 'pick': {
      const Z = S.quiz; if (Z.sel !== null) break;
      Z.sel = +v; const q = Z.qs[Z.i];
      if (Z.sel === q.a) Z.score++; else Z.missed.push(q);
      render(); speak(filled(q, q.o[q.a])); break; }
    case 'say': { const q = S.quiz.qs[S.quiz.i]; forceSpeak(filled(q, q.o[q.a])); break; }
    case 'next': S.quiz.i++; S.quiz.sel = null; render(); window.scrollTo(0,0); break;
    case 'again': startQuiz(S.quiz.L, S.quiz.s); break;
    case 'gonext': {
      const sq = seq(); const i = sq.findIndex(x => x.L === S.quiz.L && x.s === S.quiz.s); const nx = sq[i+1];
      S.level = nx.L; openStep(nx.L, nx.s); break; }
    /* speaking */
    case 'hear': forceSpeak(lvl_sp().phrases[S.sp.p].t, 0.92); break;
    case 'hearslow': forceSpeak(lvl_sp().phrases[S.sp.p].t, 0.6); break;
    case 'mic': {
      const X = S.sp; const L = lvl_sp(); X.state = 'listening'; X.msg = ''; render();
      listen(txt => {
        X.state = 'idle'; X.heard = txt;
        if (X.p < L.phrases.length){
          X.res = compare(L.phrases[X.p].t, txt);
          if (X.res.score >= 0.7) markPhrase(X.L, X.p);
        }
        render();
      }, err => {
        X.state = 'idle';
        X.msg = (err === 'not-allowed' || err === 'service-not-allowed' || err === 'unsupported')
          ? 'The microphone is not available here. Please say the sentence aloud, then tap "I said it".'
          : 'Sorry, I could not hear you. Please tap the microphone and try again.';
        render();
      });
      break; }
    case 'saidit': markPhrase(S.sp.L, S.sp.p); S.sp.msg = 'Great job! Marked as done.'; render(); break;
    case 'skipnext': S.sp.p++; S.sp.heard = null; S.sp.res = null; S.sp.msg = ''; render(); window.scrollTo(0,0); break;
    case 'prev': { const X = S.sp; X.p = Math.max(0, Math.min(X.p, lvl_sp().phrases.length + (lvl_sp().dialog ? 1 : 0)) - 1); X.heard = null; X.res = null; X.msg = ''; render(); break; }
    case 'readback': { const t = (S.sp.typed || '').trim(); if (t) forceSpeak(t, 0.92); else { S.sp.msg = 'Please type your answer first.'; render(); } break; }
    case 'finish': S.view = 'home'; render(); break;
  }
});
function lvl_sp(){ return bank()[S.sp.L - 1]; }
function dlAuto(){
  const X = S.sp; if (!X || !X.dl) return; const D = lvl_sp().dialog; const ln = D.lines[X.dl.i];
  if (ln && ln[0] !== X.dl.role) speak(ln[1], 0.92, ln[0] === 0 ? 1 : 1.25);
}

/* voices load late in some browsers */
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e){}

/* start: go to the next unfinished step's level */
{ const n = nextStep(); S.level = n.item.L; }
render();
})();
